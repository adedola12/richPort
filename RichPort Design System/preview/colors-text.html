<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label-row"><span>Foreground / Text</span><span class="dot">●</span></div>
  <div class="swatch-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr 1fr;">
    <div class="swatch on-light" style="background:#FFFFFF"><div class="meta"><span class="name">fg-1</span><span class="hex">FFFFFF</span></div></div>
    <div class="swatch on-light" style="background:#E5E5E5"><div class="meta"><span class="name">fg-2</span><span class="hex">E5E5E5</span></div></div>
    <div class="swatch on-light" style="background:#D4D4D4"><div class="meta"><span class="name">fg-3</span><span class="hex">D4D4D4</span></div></div>
    <div class="swatch on-light" style="background:#A3A3A3"><div class="meta"><span class="name">fg-4</span><span class="hex">A3A3A3</span></div></div>
    <div class="swatch on-light" style="background:#98989A"><div class="meta"><span class="name">fg-mute</span><span class="hex">98989A</span></div></div>
  </div>
  <div style="margin-top:14px; padding:14px 16px; border:1px solid var(--border-strong); border-radius:12px; background:#0B0B0B">
    <p style="font-family:var(--font-display); font-size:18px; font-weight:600; color:#fff; margin-bottom:4px;">Heading on fg-1</p>
    <p style="font-family:var(--font-body); font-size:14px; color:#E5E5E5; margin-bottom:3px;">Body copy lands on fg-2 — neutral-200.</p>
    <p style="font-family:var(--font-body); font-size:12px; color:#98989A;">Meta and project URLs sit on fg-mute.</p>
  </div>
</div>
</body></html>
