<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label-row"><span>Display heading</span><span class="dot">●</span></div>
  <div style="
      font-weight:600;
      font-size:52px;
      line-height:0.95;
      letter-spacing:-0.05em;
      background: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 38%, #8A8A8A 100%);

      background-clip:text;
      color:transparent;
      -webkit-text-stroke: 0.5px rgba(255,255,255,0.55);
      text-align:center;
      padding: 4px 0;
    ">
    Explore curated designs<br>crafted with passion.
  </div>
  <p style="font-size:11px; color:#98989A; margin-top:14px; line-height:1.4; text-align:center;">
    Outfit 600 · clamp(40px, 6vw, 72px) · 0.95 line-height · −0.05em tracking · gradient-clipped white → #8A8A8A · −webkit-text-stroke 0.5px rgba(255,255,255,0.55) for the silver edge.
  </p>
</div>
</body></html>
