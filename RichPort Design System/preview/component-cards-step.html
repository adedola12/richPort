<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label-row"><span>Process step card</span><span class="dot">●</span></div>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
    <div style="border-radius:22px; border:1px solid #202020; background:#0B0B0B; padding:18px 22px;">
      <div style="width:36px;height:36px; border-radius:8px; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; color:#A3E635; font-size:18px; margin-bottom:14px;">⌕</div>
      <h3 style="font-family:'Outfit'; font-weight:600; font-size:18px; color:transparent; background:linear-gradient(180deg,#fff 0%,#fff 50%,#D4D4D4 100%); -webkit-background-clip:text; background-clip:text;">Discover</h3>
      <p style="margin-top:6px; font-family:'Outfit'; font-size:13px; line-height:1.5; color:#D4D4D4;">Understanding the problem and defining the goal.</p>
    </div>
    <div style="border-radius:22px; border:1px solid #A3E635; background:#0B0B0B; padding:18px 22px; transform:translateY(-3px); box-shadow:0 0 24px rgba(190,242,100,0.18);">
      <div style="width:36px;height:36px; border-radius:8px; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; color:#A3E635; font-size:18px; margin-bottom:14px;">💡</div>
      <h3 style="font-family:'Outfit'; font-weight:600; font-size:18px; color:transparent; background:linear-gradient(180deg,#fff 0%,#fff 50%,#D4D4D4 100%); -webkit-background-clip:text; background-clip:text;">Ideate</h3>
      <p style="margin-top:6px; font-family:'Outfit'; font-size:13px; line-height:1.5; color:#D4D4D4;">Brainstorm ideas and explore multiple directions.</p>
    </div>
  </div>
  <p style="font-family:'Outfit'; font-size:11px; color:#98989A; margin-top:auto;">Default · hover (lime border + lift)</p>
</div>
</body></html>
