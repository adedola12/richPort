<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label-row"><span>Corner radii</span><span class="dot">●</span></div>
  <div style="display:grid; grid-template-columns: repeat(6, 1fr); gap:10px; align-items:end;">
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:60px;height:60px; background:linear-gradient(135deg,#1a1a1a,#262626); border:1px solid #2b2c30; border-radius:9999px"></div>
        <div style="font-family:'Outfit'; font-weight:600; font-size:11px; color:#fff;">pill</div>
        <div style="font-family:'Outfit'; font-size:10px; color:#98989A;">9999px</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:60px;height:60px; background:linear-gradient(135deg,#1a1a1a,#262626); border:1px solid #2b2c30; border-radius:9px"></div>
        <div style="font-family:'Outfit'; font-weight:600; font-size:11px; color:#fff;">tag</div>
        <div style="font-family:'Outfit'; font-size:10px; color:#98989A;">9px</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:60px;height:60px; background:linear-gradient(135deg,#1a1a1a,#262626); border:1px solid #2b2c30; border-radius:6px"></div>
        <div style="font-family:'Outfit'; font-weight:600; font-size:11px; color:#fff;">chip</div>
        <div style="font-family:'Outfit'; font-size:10px; color:#98989A;">6px</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:60px;height:60px; background:linear-gradient(135deg,#1a1a1a,#262626); border:1px solid #2b2c30; border-radius:10px"></div>
        <div style="font-family:'Outfit'; font-weight:600; font-size:11px; color:#fff;">md</div>
        <div style="font-family:'Outfit'; font-size:10px; color:#98989A;">10px</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:60px;height:60px; background:linear-gradient(135deg,#1a1a1a,#262626); border:1px solid #2b2c30; border-radius:12px"></div>
        <div style="font-family:'Outfit'; font-weight:600; font-size:11px; color:#fff;">lg</div>
        <div style="font-family:'Outfit'; font-size:10px; color:#98989A;">12px</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:60px;height:60px; background:linear-gradient(135deg,#1a1a1a,#262626); border:1px solid #2b2c30; border-radius:14px"></div>
        <div style="font-family:'Outfit'; font-weight:600; font-size:11px; color:#fff;">xl</div>
        <div style="font-family:'Outfit'; font-size:10px; color:#98989A;">14px</div>
      </div>
    
  </div>
  <div style="margin-top:14px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px;">
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:96px;height:60px; background:linear-gradient(135deg,#1a1a1a,#262626); border:1px solid #2b2c30; border-radius:22px"></div>
        <div style="font-family:'Outfit'; font-weight:600; font-size:11px; color:#fff;">2xl · 22px</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:96px;height:60px; background:linear-gradient(135deg,#1a1a1a,#262626); border:1px solid #2b2c30; border-radius:28px"></div>
        <div style="font-family:'Outfit'; font-weight:600; font-size:11px; color:#fff;">3xl · 28px</div>
      </div>
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:96px;height:60px; background:linear-gradient(135deg,#1a1a1a,#262626); border:1px solid #2b2c30; border-radius:32px"></div>
        <div style="font-family:'Outfit'; font-weight:600; font-size:11px; color:#fff;">4xl · 32px</div>
      </div>
    
  </div>
</div>
</body></html>
