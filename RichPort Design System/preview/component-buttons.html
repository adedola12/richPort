<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label-row"><span>Buttons</span><span class="dot">●</span></div>
  <div style="display:flex; flex-direction:column; gap:14px;">
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <button style="height:40px; padding:0 24px; border-radius:8px; background:linear-gradient(to bottom,#A3E635,#65A30D); color:#000; font-family:'Outfit'; font-weight:700; font-size:13px; box-shadow:0 0 18px rgba(132,204,22,0.6); border:0; cursor:pointer;">About Me</button>
      <button style="height:40px; padding:0 24px; border-radius:8px; border:1px solid rgba(255,255,255,0.8); background:transparent; color:#fff; font-family:'Outfit'; font-weight:400; font-size:13px;">View Works</button>
      <button style="padding:10px 20px; border-radius:12px; border:1px solid #A3E635; background:transparent; color:#A3E635; font-family:'Outfit'; font-weight:500; font-size:13px; box-shadow:0 0 20px rgba(132,255,0,0.2);">⇩ View Resume</button>
    </div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <button style="padding:8px 16px; border-radius:12px; background:rgba(255,255,255,0.15); border:0.5px solid #fff; color:#fff; font-family:'Outfit'; font-weight:500; font-size:14px;">View Project</button>
      <button style="padding:6px 16px; border-radius:8px; background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.6); color:#fff; font-family:'Outfit'; font-size:12px;">View Works</button>
      <button style="padding:12px 40px; border-radius:8px; background:linear-gradient(to bottom,#A3E635,#65A30D); color:#000; font-family:'Outfit'; font-weight:800; font-size:14px; box-shadow:0 0 22px rgba(190,242,100,0.6); border:0;">Check out my rate card</button>
    </div>
    <div style="font-family:'Outfit'; font-size:11px; color:#98989A;">Primary lime CTA · Ghost outline · Lime outline · White-glass · Subtle ghost · Big lime CTA</div>
  </div>
</div>
</body></html>
