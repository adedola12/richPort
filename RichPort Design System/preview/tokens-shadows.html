<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label-row"><span>Shadows — dark</span><span class="dot">●</span></div>
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:16px; padding:24px 12px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:90px;height:60px; background:#0B0B0B; border:1px solid #2b2c30; border-radius:14px; box-shadow:0 0 40px rgba(0,0,0,0.85);"></div>
      <div style="font-family:'Outfit';font-weight:600;font-size:11px; color:#fff; text-align:center;">card<br><span style="font-weight:400; color:#98989A; font-size:10px;">0 0 40px /.85</span></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:90px;height:60px; background:#111318; border-radius:14px; box-shadow:0 24px 80px rgba(0,0,0,0.9);"></div>
      <div style="font-family:'Outfit';font-weight:600;font-size:11px; color:#fff; text-align:center;">deep<br><span style="font-weight:400; color:#98989A; font-size:10px;">0 24px 80px /.9</span></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:90px;height:60px; background:#0B0B0B; border-radius:14px; box-shadow:0 0 40px rgba(0,0,0,0.7);"></div>
      <div style="font-family:'Outfit';font-weight:600;font-size:11px; color:#fff; text-align:center;">nav<br><span style="font-weight:400; color:#98989A; font-size:10px;">0 0 40px /.7</span></div>
    </div>
  </div>
</div>
</body></html>
