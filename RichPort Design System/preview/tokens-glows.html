<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label-row"><span>Lime glows</span><span class="dot">●</span></div>
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap:14px; padding:18px 8px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:80px;height:34px; background:linear-gradient(to bottom,#A3E635,#65A30D); border-radius:12px; box-shadow:0 0 18px rgba(132,204,22,0.5);"></div>
      <div style="font-family:'Outfit';font-weight:600;font-size:10px; color:#fff;">soft</div>
      <div style="font-family:'Outfit';font-size:9px; color:#98989A; text-align:center;">0 0 18px /.5</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:80px;height:34px; background:linear-gradient(to bottom,#A3E635,#65A30D); border-radius:12px; box-shadow:0 0 22px rgba(190,242,100,0.6);"></div>
      <div style="font-family:'Outfit';font-weight:600;font-size:10px; color:#fff;">mid</div>
      <div style="font-family:'Outfit';font-size:9px; color:#98989A; text-align:center;">0 0 22px /.6</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:80px;height:34px; background:linear-gradient(to bottom,#A3E635,#65A30D); border-radius:12px; box-shadow:0 0 30px rgba(190,242,100,0.8);"></div>
      <div style="font-family:'Outfit';font-weight:600;font-size:10px; color:#fff;">hard</div>
      <div style="font-family:'Outfit';font-size:9px; color:#98989A; text-align:center;">0 0 30px /.8</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:80px;height:34px; background:#0B0B0B; border:1px solid #89FF00; border-radius:12px; box-shadow:0 0 35px rgba(137,255,0,0.12);"></div>
      <div style="font-family:'Outfit';font-weight:600;font-size:10px; color:#fff;">card hover</div>
      <div style="font-family:'Outfit';font-size:9px; color:#98989A; text-align:center;">0 0 35px /.12</div>
    </div>
  </div>
  <p style="font-family:var(--font-body); font-size:11px; color:#98989A; margin-top:4px; text-align:center;">Ambient radial lights also live behind every section — see Brand cards.</p>
</div>
</body></html>
