<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="position:relative;">
  <div class="glow" style="background:#84CC16; opacity:.25; width:280px;height:280px; right:-80px; top:-80px;"></div>
  <div class="label-row"><span>Brand Lime — The signature accent</span><span class="dot">●</span></div>
  <div class="swatch-grid" style="grid-template-columns: repeat(6, 1fr);">
    <div class="swatch on-light" style="background:#BEF264"><div class="meta"><span class="name">300</span><span class="hex">BEF264</span></div></div>
    <div class="swatch on-light" style="background:#A3E635"><div class="meta"><span class="name">400</span><span class="hex">A3E635</span></div></div>
    <div class="swatch on-light" style="background:#84CC16"><div class="meta"><span class="name">500</span><span class="hex">84CC16</span></div></div>
    <div class="swatch on-light" style="background:#65A30D"><div class="meta"><span class="name">600</span><span class="hex">65A30D</span></div></div>
    <div class="swatch on-dark" style="background:#4D7C0F"><div class="meta"><span class="name">700</span><span class="hex">4D7C0F</span></div></div>
    <div class="swatch on-light" style="background:#89FF00"><div class="meta"><span class="name">neon</span><span class="hex">89FF00</span></div></div>
  </div>
  <div style="margin-top:14px; display:flex; gap:10px; align-items:center;">
    <div style="height:40px; padding:0 20px; display:flex; align-items:center; border-radius:12px; background:linear-gradient(to bottom,#A3E635,#65A30D); color:#000; font-family:'Outfit'; font-weight:700; font-size:13px; box-shadow:0 0 18px rgba(132,204,22,0.5);">Gradient lime CTA</div>
    <div style="height:40px; padding:0 16px; display:flex; align-items:center; border-radius:9px; border:1px solid #89FF00; color:#89FF00; font-family:'Outfit'; font-weight:600; font-size:11px;">TAG NEON</div>
  </div>
</div>
</body></html>
