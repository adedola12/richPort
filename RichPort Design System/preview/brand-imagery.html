<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label-row"><span>Imagery treatment</span><span class="dot">●</span></div>
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; flex:1;">
    <div style="position:relative; border-radius:12px; overflow:hidden; border:1px solid #A3E635;">
      <img src="../assets/portrait.jpg" style="width:100%; height:100%; object-fit:cover; filter:grayscale(1);">
      <div style="position:absolute; inset:0; background:linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.85));"></div>
      <span style="position:absolute; bottom:8px; left:8px; font-family:'Outfit'; font-size:10px; font-weight:600; color:#fff;">PORTRAIT · grayscale</span>
    </div>
    <div style="position:relative; border-radius:12px; overflow:hidden; border:1px solid #2b2c30;">
      <img src="../assets/ui-mock-hero.png" style="width:100%; height:100%; object-fit:cover;">
      <span style="position:absolute; bottom:8px; left:8px; font-family:'Outfit'; font-size:10px; font-weight:600; color:#fff;">PROJECT · color</span>
    </div>
    <div style="position:relative; border-radius:12px; overflow:hidden; border:1px solid #2b2c30; background:#0B0B0B; display:flex; align-items:center; justify-content:center; padding:20px;">
      <img src="../assets/partners/adlm.png" style="max-width:80%; max-height:60%; object-fit:contain; filter:grayscale(1) brightness(2);">
      <span style="position:absolute; bottom:8px; left:8px; font-family:'Outfit'; font-size:10px; font-weight:600; color:#fff;">PARTNER · b/w → color</span>
    </div>
  </div>
  <p style="font-family:'Outfit'; font-size:11px; color:#98989A; margin-top:10px;">Portraits + partners default to grayscale, hover reveals color. Project thumbnails always in color.</p>
</div>
</body></html>
