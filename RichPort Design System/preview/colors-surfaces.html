<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label-row"><span>Surfaces</span><span class="dot">●</span></div>
  <div class="swatch-grid" style="grid-template-columns: 1.4fr 1fr 1fr; grid-template-rows: 1fr 1fr;">
    <div class="swatch on-dark" style="background:#050505; grid-row: span 2;">
      <div class="meta"><span class="name">bg-deep</span><span class="hex">#050505</span></div>
    </div>
    <div class="swatch on-dark" style="background:#0B0B0B"><div class="meta"><span class="name">bg-base</span><span class="hex">#0B0B0B</span></div></div>
    <div class="swatch on-dark" style="background:#111318"><div class="meta"><span class="name">bg-raised</span><span class="hex">#111318</span></div></div>
    <div class="swatch on-dark" style="background:#181820"><div class="meta"><span class="name">bg-elev</span><span class="hex">#181820</span></div></div>
    <div class="swatch on-dark" style="background:#262626"><div class="meta"><span class="name">bg-chip</span><span class="hex">#262626</span></div></div>
  </div>
</div>
</body></html>
