<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label-row"><span>Accent supports — used sparingly</span><span class="dot">●</span></div>
  <div class="swatch-grid" style="grid-template-columns:1fr 1fr 1fr 1fr;">
    <div class="swatch on-dark" style="background:linear-gradient(to bottom,#6366F1,#4338CA)"><div class="meta"><span class="name">indigo 500→700</span><span class="hex">badge</span></div></div>
    <div class="swatch on-dark" style="background:linear-gradient(to bottom,#64748B,#1E293B)"><div class="meta"><span class="name">slate 500→800</span><span class="hex">cta</span></div></div>
    <div class="swatch on-dark" style="background:rgba(16,185,129,0.40)"><div class="meta"><span class="name">emerald tint</span><span class="hex">nav</span></div></div>
    <div class="swatch on-dark" style="background:rgba(56,189,248,0.40)"><div class="meta"><span class="name">sky tint</span><span class="hex">nav</span></div></div>
  </div>
  <p style="margin-top:14px; font-family:var(--font-body); font-size:12px; color:#98989A; line-height:1.5;">
    Indigo: one premium pricing badge only. Slate: one inactive plan CTA. Emerald + Sky: nav gradient stops, never solid fills.
  </p>
</div>
</body></html>
