<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label-row"><span>Borders &amp; dividers</span><span class="dot">●</span></div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; flex:1;">
    <div style="border:1px solid #2b2c30; border-radius:12px; padding:14px; background:#0B0B0B;">
      <div style="font-family:var(--font-ui); font-size:10px; color:#98989A; letter-spacing:.15em; text-transform:uppercase; margin-bottom:6px;">border-strong</div>
      <div style="font-family:var(--font-ui); font-size:14px; color:#fff;">#2B2C30</div>
      <p style="font-family:var(--font-body); font-size:11px; color:#A3A3A3; margin-top:4px;">Card edges, form cards.</p>
    </div>
    <div style="border:1px solid #242424; border-radius:12px; padding:14px; background:#0B0B0B;">
      <div style="font-family:var(--font-ui); font-size:10px; color:#98989A; letter-spacing:.15em; text-transform:uppercase; margin-bottom:6px;">border-mid</div>
      <div style="font-family:var(--font-ui); font-size:14px; color:#fff;">#242424</div>
      <p style="font-family:var(--font-body); font-size:11px; color:#A3A3A3; margin-top:4px;">Underline inputs, vertical rules.</p>
    </div>
    <div style="border:1px solid #202020; border-radius:12px; padding:14px; background:#0B0B0B;">
      <div style="font-family:var(--font-ui); font-size:10px; color:#98989A; letter-spacing:.15em; text-transform:uppercase; margin-bottom:6px;">border-soft</div>
      <div style="font-family:var(--font-ui); font-size:14px; color:#fff;">#202020</div>
      <p style="font-family:var(--font-body); font-size:11px; color:#A3A3A3; margin-top:4px;">Process step cards.</p>
    </div>
    <div style="border:1px solid rgba(255,255,255,0.10); border-radius:12px; padding:14px; background:#0B0B0B;">
      <div style="font-family:var(--font-ui); font-size:10px; color:#98989A; letter-spacing:.15em; text-transform:uppercase; margin-bottom:6px;">border-faint</div>
      <div style="font-family:var(--font-ui); font-size:14px; color:#fff;">rgba(255,255,255,.10)</div>
      <p style="font-family:var(--font-body); font-size:11px; color:#A3A3A3; margin-top:4px;">Glass pills, nav.</p>
    </div>
  </div>
</div>
</body></html>
