<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label-row"><span>Form inputs</span><span class="dot">●</span></div>
  <div style="background:#111318; border:1px solid rgba(255,255,255,0.05); border-radius:14px; padding:20px; box-shadow:0 24px 80px rgba(0,0,0,0.9);">
    <label style="display:block; font-family:'Outfit'; font-weight:600; font-size:13px; color:#fff;">Full Name</label>
    <div style="margin-top:12px; border-bottom:1px solid #242424; padding-bottom:8px;">
      <input value="Richard Enoch" style="width:100%; background:transparent; border:0; outline:0; font-family:'Outfit'; font-size:13px; color:#fff;">
    </div>
    <label style="display:block; font-family:'Outfit'; font-weight:600; font-size:13px; color:#fff; margin-top:16px;">Email</label>
    <div style="margin-top:12px; border-bottom:1px solid #A3E635; padding-bottom:8px;">
      <input placeholder="Type here" style="width:100%; background:transparent; border:0; outline:0; font-family:'Outfit'; font-size:13px; color:#fff;">
    </div>
    <div style="margin-top:18px; display:flex; gap:10px; align-items:center;">
      <span style="display:inline-flex; height:24px; width:24px; align-items:center; justify-content:center; border-radius:6px; border:1px solid #A3E635; background:#141518; box-shadow:0 0 14px rgba(190,242,100,0.7); color:#A3E635; font-weight:700;">✓</span>
      <span style="font-family:'Outfit'; font-size:13px; color:#E5E5E5;">Brand Identity Design</span>
    </div>
  </div>
  <div style="font-family:'Outfit'; font-size:11px; color:#98989A; margin-top:8px;">Underline-only fields · focus border flips lime · custom checkbox with lime ring</div>
</div>
</body></html>
